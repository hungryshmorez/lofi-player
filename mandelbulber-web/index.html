<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fractalarium — a browser Mandelbulb explorer</title>
<meta name="description" content="A real-time, interactive 3D Mandelbulb fractal explorer in the browser. Inspired by Mandelbulber2." />
<style>
  :root {
    --bg: #05060a;
    --panel: rgba(16, 18, 28, 0.72);
    --panel-border: rgba(140, 170, 255, 0.18);
    --text: #e8ecff;
    --muted: #9aa3c7;
    --accent: #6ad0ff;
    --accent2: #c77dff;
    --track: rgba(150, 170, 220, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #glcanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #glcanvas.dragging { cursor: grabbing; }

  /* --- top bar --- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    pointer-events: none;
  }
  #brand { pointer-events: auto; }
  #brand h1 {
    margin: 0; font-size: 15px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase;
  }
  #brand p { margin: 2px 0 0; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  #hud { margin-left: auto; pointer-events: none; text-align: right; font-size: 10px; color: var(--muted); line-height: 1.5; }
  #hud b { color: var(--accent); font-weight: 600; }

  /* --- control panel --- */
  #panel {
    position: fixed; top: 64px; right: 14px; z-index: 6;
    width: 288px; max-height: calc(100vh - 84px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border); border-radius: 16px;
    padding: 14px 16px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
    scrollbar-width: thin; scrollbar-color: var(--track) transparent;
  }
  #panel.hidden { transform: translateX(120%); opacity: 0; pointer-events: none; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: var(--track); border-radius: 8px; }

  .group { margin-top: 14px; }
  .group:first-child { margin-top: 4px; }
  .group > .glabel {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px; opacity: .85;
  }
  .group > .glabel::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--panel-border), transparent); }

  .row { margin: 9px 0; }
  .row .rlabel { display: flex; justify-content: space-between; font-size: 11px; color: var(--text); margin-bottom: 5px; }
  .row .rlabel span.val { color: var(--muted); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px;
    background: var(--track); outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    cursor: pointer; box-shadow: 0 0 10px rgba(120,180,255,.6); border: 2px solid #0a0c14;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%; border: 2px solid #0a0c14;
    background: var(--accent2); cursor: pointer;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: 10px; letter-spacing: .5px;
    padding: 6px 9px; border-radius: 9px; color: var(--muted);
    background: rgba(255,255,255,.04); border: 1px solid var(--panel-border);
    transition: all .18s; flex: 1 1 auto; text-align: center;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { color: #06131c; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; font-weight: 700; }

  .toggle { display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin: 9px 0; cursor: pointer; }
  .toggle .sw { width: 36px; height: 20px; border-radius: 20px; background: var(--track); position: relative; transition: background .2s; flex: 0 0 auto; }
  .toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#cfd6f5; transition: transform .2s; }
  .toggle.on .sw { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .toggle.on .sw::after { transform: translateX(16px); }

  .btnrow { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    pointer-events: auto; flex: 1; cursor: pointer; font: inherit; font-size: 11px;
    padding: 9px; border-radius: 10px; color: var(--text);
    background: rgba(255,255,255,.05); border: 1px solid var(--panel-border); transition: all .18s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* --- floating toggle button (when panel hidden) --- */
  #fab {
    position: fixed; top: 64px; right: 14px; z-index: 7; width: 44px; height: 44px; border-radius: 12px;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
    color: var(--accent); font-size: 20px;
  }

  /* --- bottom hint --- */
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: center;
    background: rgba(10,12,20,.5); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--panel-border);
    backdrop-filter: blur(8px); transition: opacity .6s; pointer-events: none; white-space: nowrap;
  }
  @media (max-width: 640px) {
    #panel { width: calc(100vw - 28px); top: auto; bottom: 0; right: 0; left: 0;
             max-height: 56vh; border-radius: 18px 18px 0 0; }
    #panel.hidden { transform: translateY(120%); }
    #fab { top: auto; bottom: 14px; right: 14px; }
    #hint { display: none; }
    #hud { display: none; }
  }
  /* loading / error */
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         z-index: 20; text-align: center; padding: 24px; font-size: 13px; line-height: 1.6; color: var(--muted);
         background: radial-gradient(circle at 50% 40%, #0b1020, #04050a); }
  #msg .big { font-size: 16px; color: var(--text); margin-bottom: 8px; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div id="topbar">
  <div id="brand">
    <h1>Fractalarium</h1>
    <p>real-time mandelbulb · webgl</p>
  </div>
  <div id="hud">
    <div><b id="fps">–</b> fps</div>
    <div>power <b id="hudPower">8.0</b></div>
  </div>
</div>

<div id="fab" title="Show controls">⚙</div>

<div id="panel">
  <div class="group">
    <div class="glabel">Form</div>
    <div class="row">
      <div class="rlabel"><label>Power (morph)</label><span class="val" id="v_power">8.00</span></div>
      <input type="range" id="power" min="2" max="16" step="0.05" value="8">
    </div>
    <div class="row">
      <div class="rlabel"><label>Detail (iterations)</label><span class="val" id="v_iter">12</span></div>
      <input type="range" id="iter" min="2" max="20" step="1" value="12">
    </div>
    <div class="toggle" id="t_animate"><span>Auto-morph power</span><span class="sw"></span></div>
    <div class="toggle on" id="t_rotate"><span>Auto-rotate</span><span class="sw"></span></div>
  </div>

  <div class="group">
    <div class="glabel">Look</div>
    <div class="chips" id="palettes"></div>
    <div class="row" style="margin-top:12px">
      <div class="rlabel"><label>Hue shift</label><span class="val" id="v_hue">0.00</span></div>
      <input type="range" id="hue" min="0" max="1" step="0.005" value="0">
    </div>
    <div class="row">
      <div class="rlabel"><label>Glow</label><span class="val" id="v_glow">0.35</span></div>
      <input type="range" id="glow" min="0" max="1" step="0.01" value="0.35">
    </div>
    <div class="row">
      <div class="rlabel"><label>Light angle</label><span class="val" id="v_light">0.9</span></div>
      <input type="range" id="light" min="0" max="6.28" step="0.01" value="0.9">
    </div>
  </div>

  <div class="group">
    <div class="glabel">Render</div>
    <div class="row">
      <div class="rlabel"><label>Quality</label><span class="val" id="v_quality">Balanced</span></div>
      <input type="range" id="quality" min="0" max="3" step="1" value="1">
    </div>
    <div class="toggle on" id="t_shadow"><span>Soft shadows</span><span class="sw"></span></div>
  </div>

  <div class="btnrow">
    <button class="btn" id="btnReset">Reset view</button>
    <button class="btn" id="btnRandom">Surprise me</button>
  </div>
  <div class="btnrow">
    <button class="btn" id="btnShot">Save PNG</button>
    <button class="btn" id="btnHide">Hide ⟩</button>
  </div>
</div>

<div id="hint">drag to orbit · scroll to zoom · <b>H</b> hide UI · <b>Space</b> pause · <b>R</b> reset</div>

<div id="msg"><div><div class="big">initializing…</div>summoning the fractal</div></div>

<script>
"use strict";
(function () {
  const canvas = document.getElementById("glcanvas");
  const msg = document.getElementById("msg");
  const gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true, powerPreference: "high-performance" })
          || canvas.getContext("experimental-webgl", { preserveDrawingBuffer: true });

  if (!gl) {
    msg.innerHTML = '<div><div class="big">WebGL not available</div>This explorer needs a WebGL-capable browser.</div>';
    return;
  }

  /* ---------- shaders ---------- */
  const VERT = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  const FRAG = `
    precision highp float;

    uniform vec2  uRes;
    uniform float uTime;
    uniform float uPower;
    uniform int   uIter;
    uniform int   uMaxSteps;
    uniform vec3  uCamPos;
    uniform mat3  uCamBasis;   // right, up, forward
    uniform float uHue;
    uniform float uGlow;
    uniform float uLight;
    uniform int   uShadow;
    uniform vec3  uPalA;
    uniform vec3  uPalB;
    uniform vec3  uPalC;
    uniform vec3  uPalD;

    #define MAX_ITER 20
    #define MAX_STEPS 160
    #define FAR 12.0

    // IQ cosine palette
    vec3 palette(float t) {
      return uPalA + uPalB * cos(6.28318530718 * (uPalC * t + uPalD + uHue));
    }

    // Mandelbulb distance estimator with orbit trap
    float map(vec3 pos, out vec4 trap) {
      vec3 z = pos;
      float dr = 1.0;
      float r = 0.0;
      float power = uPower;
      trap = vec4(1e10);
      for (int i = 0; i < MAX_ITER; i++) {
        if (i >= uIter) break;
        r = length(z);
        if (r > 2.2) break;
        float theta = acos(clamp(z.z / r, -1.0, 1.0));
        float phi = atan(z.y, z.x);
        dr = pow(r, power - 1.0) * power * dr + 1.0;
        float zr = pow(r, power);
        theta *= power;
        phi *= power;
        z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta));
        z += pos;
        trap = min(trap, vec4(abs(z), dot(z, z)));
      }
      return 0.5 * log(r) * r / dr;
    }

    float mapD(vec3 p) { vec4 t; return map(p, t); }

    vec3 calcNormal(vec3 p) {
      vec2 e = vec2(0.0008, 0.0);
      return normalize(vec3(
        mapD(p + e.xyy) - mapD(p - e.xyy),
        mapD(p + e.yxy) - mapD(p - e.yxy),
        mapD(p + e.yyx) - mapD(p - e.yyx)
      ));
    }

    // soft shadow
    float softShadow(vec3 ro, vec3 rd) {
      float res = 1.0;
      float t = 0.02;
      for (int i = 0; i < 40; i++) {
        if (i >= 40) break;
        float h = mapD(ro + rd * t);
        if (h < 0.0006) return 0.0;
        res = min(res, 10.0 * h / t);
        t += clamp(h, 0.01, 0.2);
        if (t > 5.0) break;
      }
      return clamp(res, 0.0, 1.0);
    }

    void main() {
      vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

      vec3 ro = uCamPos;
      vec3 rd = normalize(uCamBasis * vec3(uv, 1.6));

      float t = 0.0;
      float glow = 0.0;
      float minDist = 1e10;
      bool hit = false;
      vec4 trap = vec4(0.0);
      int steps = 0;

      for (int i = 0; i < MAX_STEPS; i++) {
        if (i >= uMaxSteps) break;
        steps = i;
        vec3 p = ro + rd * t;
        vec4 tr;
        float d = map(p, tr);
        minDist = min(minDist, d);
        // accumulate volumetric glow near the surface
        glow += 0.014 / (1.0 + d * d * 220.0);
        if (d < 0.00035 * t + 0.00035) { hit = true; trap = tr; break; }
        t += d;
        if (t > FAR) break;
      }

      vec3 col = vec3(0.0);

      // background: deep gradient + faint nebula
      vec3 bg = mix(vec3(0.02, 0.03, 0.06), vec3(0.05, 0.04, 0.10), uv.y * 0.5 + 0.5);
      bg += 0.02 * palette(uv.x * 0.3 + uv.y * 0.2 + 0.5);

      if (hit) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        vec3 lightDir = normalize(vec3(cos(uLight) * 1.2, 0.85, sin(uLight) * 1.2));

        float diff = clamp(dot(n, lightDir), 0.0, 1.0);
        float amb = 0.35 + 0.25 * n.y;
        float ao = 1.0 - float(steps) / float(uMaxSteps);
        ao = clamp(ao * ao * 1.15, 0.0, 1.0);
        float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);

        float sh = 1.0;
        if (uShadow == 1) sh = softShadow(p + n * 0.003, lightDir);

        // orbit-trap driven color
        float tc = sqrt(trap.w);
        vec3 base = palette(tc * 0.9 + trap.x * 0.15);
        vec3 base2 = palette(trap.y * 0.4 + 0.35);
        base = mix(base, base2, 0.4);

        vec3 spec = vec3(1.0) * pow(clamp(dot(reflect(-lightDir, n), -rd), 0.0, 1.0), 24.0);

        col = base * (amb * ao + diff * sh * 1.15);
        col += spec * sh * 0.6;
        col += fres * base * 0.6;
        // depth fade
        col = mix(col, bg, clamp(t / FAR, 0.0, 1.0) * 0.55);
      } else {
        col = bg;
      }

      // add glow
      col += uGlow * glow * palette(0.6 + 0.2 * sin(uTime * 0.1));

      // tone map + vignette + gamma
      col = col / (col + vec3(0.6));
      float vig = 1.0 - 0.28 * dot(uv, uv);
      col *= clamp(vig, 0.0, 1.0);
      col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    msg.innerHTML = '<div><div class="big">shader error</div>' + String(e.message || e).slice(0, 300) + '</div>';
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ["uRes","uTime","uPower","uIter","uMaxSteps","uCamPos","uCamBasis","uHue","uGlow","uLight","uShadow","uPalA","uPalB","uPalC","uPalD"]
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));

  /* ---------- palettes (IQ cosine) ---------- */
  const PALETTES = [
    { name: "Aurora",  a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[1.0,1.0,1.0], d:[0.0,0.10,0.20] },
    { name: "Ember",   a:[0.5,0.4,0.3], b:[0.5,0.4,0.35],c:[1.0,1.0,1.0], d:[0.0,0.05,0.10] },
    { name: "Magma",   a:[0.55,0.4,0.4],b:[0.45,0.35,0.3],c:[1.0,1.2,1.0],d:[0.0,0.25,0.45] },
    { name: "Toxic",   a:[0.4,0.5,0.3], b:[0.4,0.5,0.35],c:[1.0,1.0,0.7], d:[0.30,0.20,0.55] },
    { name: "Ice",     a:[0.45,0.5,0.6],b:[0.35,0.4,0.5],c:[1.0,1.0,1.0], d:[0.55,0.60,0.70] },
    { name: "Candy",   a:[0.6,0.5,0.6], b:[0.4,0.45,0.4],c:[1.0,1.0,1.0], d:[0.80,0.90,0.30] },
    { name: "Mono",    a:[0.6,0.6,0.62],b:[0.4,0.4,0.42],c:[1.0,1.0,1.0], d:[0.0,0.0,0.0] },
  ];

  /* ---------- state ---------- */
  const state = {
    power: 8, iter: 12, maxSteps: 110, hue: 0, glow: 0.35, light: 0.9,
    shadow: true, animate: false, rotate: true, quality: 1, palette: 0,
    yaw: 0.6, pitch: 0.35, dist: 2.8,
    paused: false,
  };
  const QUALITY = [
    { name: "Draft",    scale: 0.45, steps: 80 },
    { name: "Balanced", scale: 0.7,  steps: 110 },
    { name: "Sharp",    scale: 1.0,  steps: 140 },
    { name: "Ultra",    scale: 1.0,  steps: 160 },
  ];

  /* ---------- resize ---------- */
  let W = 1, H = 1;
  function resize() {
    const q = QUALITY[state.quality];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(window.innerWidth * dpr * q.scale));
    H = Math.max(1, Math.floor(window.innerHeight * dpr * q.scale));
    canvas.width = W; canvas.height = H;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    gl.viewport(0, 0, W, H);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- camera ---------- */
  function camera() {
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    // forward points from camera toward origin
    const pos = [state.dist * cp * sy, state.dist * sp, state.dist * cp * cy];
    const fwd = [-pos[0], -pos[1], -pos[2]];
    const fl = Math.hypot(fwd[0], fwd[1], fwd[2]);
    const f = [fwd[0]/fl, fwd[1]/fl, fwd[2]/fl];
    // right = normalize(cross(worldUp, f))
    const wu = [0,1,0];
    let r = [wu[1]*f[2]-wu[2]*f[1], wu[2]*f[0]-wu[0]*f[2], wu[0]*f[1]-wu[1]*f[0]];
    const rl = Math.hypot(r[0],r[1],r[2]) || 1;
    r = [r[0]/rl, r[1]/rl, r[2]/rl];
    // up = cross(f, right)
    const u = [f[1]*r[2]-f[2]*r[1], f[2]*r[0]-f[0]*r[2], f[0]*r[1]-f[1]*r[0]];
    return { pos, basis: [r[0],r[1],r[2], u[0],u[1],u[2], f[0],f[1],f[2]] };
  }

  /* ---------- render loop ---------- */
  let t0 = performance.now();
  let fpsT = t0, fpsN = 0;
  const fpsEl = document.getElementById("fps");
  const hudPower = document.getElementById("hudPower");

  function frame(now) {
    const dt = Math.min((now - t0) / 1000, 0.05); t0 = now;
    if (!state.paused) {
      if (state.rotate) state.yaw += dt * 0.18;
      if (state.animate) state.power = 8 + 5.0 * Math.sin(now * 0.00018);
    }

    const cam = camera();
    const q = QUALITY[state.quality];

    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uTime, now * 0.001);
    gl.uniform1f(U.uPower, state.power);
    gl.uniform1i(U.uIter, state.iter);
    gl.uniform1i(U.uMaxSteps, q.steps);
    gl.uniform3fv(U.uCamPos, cam.pos);
    gl.uniformMatrix3fv(U.uCamBasis, false, cam.basis);
    gl.uniform1f(U.uHue, state.hue);
    gl.uniform1f(U.uGlow, state.glow);
    gl.uniform1f(U.uLight, state.light);
    gl.uniform1i(U.uShadow, state.shadow ? 1 : 0);
    const P = PALETTES[state.palette];
    gl.uniform3fv(U.uPalA, P.a); gl.uniform3fv(U.uPalB, P.b);
    gl.uniform3fv(U.uPalC, P.c); gl.uniform3fv(U.uPalD, P.d);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // fps + hud
    fpsN++;
    if (now - fpsT > 500) {
      fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT));
      fpsT = now; fpsN = 0;
    }
    if (state.animate) hudPower.textContent = state.power.toFixed(1);

    requestAnimationFrame(frame);
  }

  /* ---------- UI wiring ---------- */
  const $ = id => document.getElementById(id);
  const panel = $("panel"), fab = $("fab"), hint = $("hint");

  function bindRange(id, key, fmt, onset) {
    const el = $(id), out = $("v_" + id);
    const upd = () => {
      let v = parseFloat(el.value);
      state[key] = v;
      if (out) out.textContent = fmt ? fmt(v) : v;
      if (onset) onset(v);
    };
    el.addEventListener("input", upd); upd();
  }
  bindRange("power", "power", v => v.toFixed(2), v => hudPower.textContent = v.toFixed(1));
  bindRange("iter", "iter", v => String(v|0));
  bindRange("hue", "hue", v => v.toFixed(2));
  bindRange("glow", "glow", v => v.toFixed(2));
  bindRange("light", "light", v => v.toFixed(1));
  bindRange("quality", "quality", v => QUALITY[v|0].name, () => resize());

  function bindToggle(id, key, extra) {
    const el = $(id);
    const sync = () => el.classList.toggle("on", !!state[key]);
    el.addEventListener("click", () => { state[key] = !state[key]; sync(); if (extra) extra(); });
    sync();
  }
  bindToggle("t_animate", "animate");
  bindToggle("t_rotate", "rotate");
  bindToggle("t_shadow", "shadow");

  // palette chips
  const palWrap = $("palettes");
  PALETTES.forEach((p, i) => {
    const c = document.createElement("div");
    c.className = "chip" + (i === 0 ? " active" : "");
    c.textContent = p.name;
    c.addEventListener("click", () => {
      state.palette = i;
      [...palWrap.children].forEach((x, j) => x.classList.toggle("active", j === i));
    });
    palWrap.appendChild(c);
  });

  function setPanel(show) {
    panel.classList.toggle("hidden", !show);
    fab.style.display = show ? "none" : "flex";
  }
  $("btnHide").addEventListener("click", () => setPanel(false));
  fab.addEventListener("click", () => setPanel(true));

  $("btnReset").addEventListener("click", resetView);
  function resetView() {
    state.yaw = 0.6; state.pitch = 0.35; state.dist = 2.8;
  }

  $("btnRandom").addEventListener("click", () => {
    state.palette = Math.floor(Math.random() * PALETTES.length);
    [...palWrap.children].forEach((x, j) => x.classList.toggle("active", j === state.palette));
    $("power").value = (3 + Math.random() * 10).toFixed(2); $("power").dispatchEvent(new Event("input"));
    $("hue").value = Math.random().toFixed(2); $("hue").dispatchEvent(new Event("input"));
    $("light").value = (Math.random() * 6.28).toFixed(2); $("light").dispatchEvent(new Event("input"));
    $("glow").value = (0.15 + Math.random() * 0.5).toFixed(2); $("glow").dispatchEvent(new Event("input"));
    state.yaw = Math.random() * 6.28; state.pitch = (Math.random() - 0.5) * 1.2;
  });

  $("btnShot").addEventListener("click", () => {
    // ensure a fresh frame is present in the buffer
    const cam = camera(); void cam;
    try {
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url; a.download = "fractalarium.png"; a.click();
    } catch (e) { /* toDataURL can be blocked in some sandboxes */ }
  });

  /* ---------- pointer / touch controls ---------- */
  let dragging = false, lastX = 0, lastY = 0;
  let pinchDist = 0;

  function orbit(dx, dy) {
    state.yaw -= dx * 0.006;
    state.pitch = Math.max(-1.5, Math.min(1.5, state.pitch + dy * 0.006));
    if (state.rotate) { /* keep auto-rotate but user override wins momentarily */ }
  }

  canvas.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    orbit(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener("pointerup", e => {
    dragging = false; canvas.classList.remove("dragging");
  });
  canvas.addEventListener("pointercancel", () => { dragging = false; canvas.classList.remove("dragging"); });

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    state.dist = Math.max(1.15, Math.min(8, state.dist * (1 + Math.sign(e.deltaY) * 0.08)));
  }, { passive: false });

  // pinch zoom for touch
  canvas.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinchDist) state.dist = Math.max(1.15, Math.min(8, state.dist * (pinchDist / d)));
      pinchDist = d;
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener("touchend", () => { pinchDist = 0; });

  /* ---------- keyboard ---------- */
  window.addEventListener("keydown", e => {
    if (e.key === "h" || e.key === "H") setPanel(panel.classList.contains("hidden"));
    else if (e.key === " ") { state.paused = !state.paused; e.preventDefault(); }
    else if (e.key === "r" || e.key === "R") resetView();
    else if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });

  // fade the hint after a while
  setTimeout(() => { if (hint) hint.style.opacity = "0"; }, 6000);

  /* ---------- go ---------- */
  msg.style.display = "none";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
